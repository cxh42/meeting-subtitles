[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-subtitles"
version = "0.1.0"
description = "Real-time English→Chinese meeting subtitles that run entirely on your own GPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "cxh42" }]
keywords = [
    "subtitles", "transcription", "translation", "whisper", "speech-to-text",
    "meetings", "zoom", "real-time", "offline", "chinese",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # The transcription + translation engine. `translation` pulls in nllw,
    # which is what actually runs NLLB in-process alongside Whisper.
    "whisperlivekit[translation]>=0.2.26",
    # Whole-sentence refinement runs a local instruct model directly.
    "transformers>=4.40",
    "accelerate>=0.26",
    "websockets>=12",
    # Finds the engine by the port it holds, so "stop engine" works even for
    # an engine this launcher did not start.
    "psutil>=5.9",
    # Rounded corners via the X11 SHAPE extension. Optional in practice --
    # without it windows are square -- but small enough to just depend on.
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/cxh42/meeting-subtitles"
Issues = "https://github.com/cxh42/meeting-subtitles/issues"
"Upstream engine" = "https://github.com/QuentinFuxa/WhisperLiveKit"

[project.scripts]
meeting-subtitles = "meeting_subtitles.launcher:main"
meeting-subtitles-engine = "meeting_subtitles.serve:main"
meeting-subtitles-doctor = "meeting_subtitles.doctor:main"
meeting-subtitles-run = "meeting_subtitles.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["meeting_subtitles"]

[tool.hatch.build.targets.sdist]
include = ["meeting_subtitles", "tools", "docs", "install.sh", "README*.md",
           "LICENSE", "NOTICE"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are almost all Chinese prose in docstrings
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# The screenshot script holds a table of sample subtitles. `dict(text=...)`
# lines up as a table; `{"text": ...}` does not, and readability is the whole
# point of that constant.
"tools/screenshots.py" = ["C408"]
